name: Build and Release

on:
  push:
    branches: [ "26.1" ]
  pull_request:
    branches: [ "26.1" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      id: build
      continue-on-error: true
      run: ./gradlew remapJar --stacktrace 2>&1 | tee build.log
      
    - name: List build output
      if: always()
      run: |
        echo "=== Build directory contents ==="
        find build -type f 2>/dev/null | head -50 || echo "build directory does not exist"
        echo ""
        echo "=== JAR files ==="
        find . -name "*.jar" -type f 2>/dev/null | head -20 || echo "No JAR files found"
        echo ""
        echo "=== build/libs/ contents ==="
        ls -lah build/libs/ 2>/dev/null || echo "build/libs/ does not exist"
      
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        
    - name: Check build status
      if: steps.build.outcome == 'failure'
      run: exit 1
      
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar
        path: build/libs/*.jar
        
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/26.1'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: mod-jar
        path: build/libs/
        
    - name: Extract version from gradle.properties
      id: version
      run: |
        VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Mod version: $VERSION"
        
    - name: Read changelog
      id: changelog
      run: |
        CHANGELOG=$(cat changelog.txt)
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Trade Refresh v${{ steps.version.outputs.version }}
        body: ${{ steps.changelog.outputs.changelog }}
        files: build/libs/*.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
