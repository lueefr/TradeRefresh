name: Build and Release

on:
  push:
    branches: [ "26.1" ]
  pull_request:
    branches: [ "26.1" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      shell: bash
      run: |
        set -o pipefail
        ./gradlew clean build --console=plain 2>&1 | tee gradle-build.log

    - name: Dedicated server smoke test
      timeout-minutes: 8
      run: python3 .github/scripts/server-smoke-test.py

    - name: Verify distributable JAR
      run: python3 .github/scripts/verify-jar.py

    - name: Report build and smoke-test logs
      if: always()
      shell: python
      run: |
        from pathlib import Path
        logs = [Path("gradle-build.log"), Path("server-smoke.log")]
        text = "\n".join(f"=== {log.name} ===\n{log.read_text()}" for log in logs if log.exists())
        # Check annotations remain available through the API when log downloads are unavailable.
        # Keep within GitHub's ten notices per step and annotation size limits.
        if len(text) > 35000:
            text = "Earlier output truncated; see workflow logs.\n" + text[-34900:]
        for offset in range(0, len(text), 3500):
            message = text[offset:offset + 3500]
            message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
            print(f"::notice title=Build logs part {offset // 3500 + 1}::{message}")

    - name: Upload JAR
      uses: actions/upload-artifact@v6
      with:
        name: traderefresh-jar
        path: build/libs/*.jar
        if-no-files-found: error

  release:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/26.1'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download JAR
      uses: actions/download-artifact@v7
      with:
        name: traderefresh-jar
        path: build/libs/

    - name: Extract version
      id: version
      run: |
        VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Trade Refresh v${{ steps.version.outputs.version }}
        body_path: changelog.txt
        files: build/libs/*.jar
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
