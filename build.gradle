plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "com.modrinth.minotaur" version "2.10.0"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    maven {
        name = "Jared"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.classtweaker")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // JEI (optional)
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-fabric-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${jei_minecraft_version}-fabric:${jei_version}"
}

// JEI 29.2.0.20 publishes internal dependencies with the incorrect "build" group.
// Keep transitive dependencies, but resolve those modules from their real group.
configurations.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group == "build" && requested.name.startsWith("jei-")) {
            useTarget("mezz.jei:${requested.name}:${requested.version}")
            because("JEI's published internal modules belong to mezz.jei, not build")
        }
    }
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def licenseName = "LICENSE_${project.mod_id}"
    from("LICENSE") {
        rename { licenseName }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = project.modrinth_project
    versionName = "Trade Refresh ${project.mod_version}"
    versionNumber = project.mod_version
    versionType = "release"
    // Minecraft 26.1+ is unobfuscated; Loom produces the distributable with jar.
    uploadFile = tasks.named("jar")
    gameVersions = ["26.1", "26.1.1", "26.1.2"]
    loaders = ["fabric"]
    changelog = new File('./changelog.txt').text.split("\n\n")[0]
    dependencies {
        required.project "fabric-api"
        optional.project "jei"
    }
}

// Allow the smoke test (and developers) to shut down the server cleanly.
tasks.named("runServer") {
    standardInput = System.in
}
